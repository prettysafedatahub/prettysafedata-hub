<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prettysafedata Hub</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, Arial;
      background: radial-gradient(circle at top, #1f2a5a, #0b0f2f);
      color: white;
    }

    .app {
      max-width: 420px;
      margin: auto;
      padding: 20px;
    }

    .top h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .top p {
      opacity: 0.7;
      font-size: 13px;
    }

    /* NETWORKS */
    .networks {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .net {
      flex: 1;
      background: rgba(255,255,255,0.12);
      padding: 14px;
      border-radius: 14px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .net:hover {
      transform: translateY(-2px);
      border: 1px solid #4f46e5;
      background: rgba(79,70,229,0.2);
    }

    /* SAFE LOGO STYLE */
    .net img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      background: white;
      border-radius: 8px;
      padding: 3px;
    }

    /* PLANS */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      padding: 18px;
      border-radius: 16px;
      text-align: center;
      backdrop-filter: blur(10px);
      transition: 0.2s;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .card:hover {
      transform: scale(1.05);
      border: 1px solid #2563eb;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      margin-top: 20px;
    }

    button {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: none;
      margin-top: 12px;
      background: linear-gradient(90deg, #2563eb, #4f46e5);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.02);
    }
  </style>
</head>

<body>

<div class="app">

  <div class="top">
    <h1>Prettysafedata Hub</h1>
    <p>Instant Mobile Data • MTN • Telecel • AT</p>
  </div>

  <!-- NETWORKS -->
  <div class="networks">

    <div class="net">
      <img src="https://upload.wikimedia.org/wikipedia/commons/9/93/MTN_Group_Logo.svg" alt="MTN">
      MTN
    </div>

    <div class="net">
      <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Telecel_Ghana_Logo.png" alt="Telecel">
      Telecel
    </div>

    <div class="net">
      <img src="https://upload.wikimedia.org/wikipedia/commons/4/4f/AirtelTigo_logo.png" alt="AT">
      AT
    </div>

  </div>

  <!-- PLANS -->
  <div class="grid">
    <div class="card">1GB - GHS 5</div>
    <div class="card">2GB - GHS 10</div>
    <div class="card">5GB - GHS 20</div>
    <div class="card">10GB - GHS 35</div>
  </div>

  <input placeholder="Enter phone number" />
  <button>Buy Data</button>

</div>

<script>
let selectedNetwork = "";
let selectedPlan = "";

// network select
document.querySelectorAll(".net").forEach(el => {
  el.addEventListener("click", () => {
    document.querySelectorAll(".net").forEach(n => n.style.background = "rgba(255,255,255,0.12)");
    el.style.background = "rgba(79,70,229,0.5)";
    selectedNetwork = el.innerText;
  });
});

// plan select
document.querySelectorAll(".card").forEach(el => {
  el.addEventListener("click", () => {
    document.querySelectorAll(".card").forEach(c => c.style.border = "1px solid transparent");
    el.style.border = "1px solid #2563eb";
    selectedPlan = el.innerText;
  });
});

// button action
document.querySelector("button").addEventListener("click", () => {
  alert("Network: " + selectedNetwork + "\nPlan: " + selectedPlan);
});
</script>

</body>
</html>
