<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prettysafedata Hub</title>

<style>
body{margin:0;font-family:system-ui;background:#0b0f2f;color:white}
.app{max-width:420px;margin:auto;padding:20px}

.box{background:#ffffff22;padding:15px;margin:10px 0;border-radius:10px;cursor:pointer}
.active{border:2px solid #2563eb}

input,button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:8px}
button{background:#2563eb;color:white;font-weight:bold}

.admin{background:#111827;padding:15px;border-radius:10px;margin-bottom:15px}
.card{background:#ffffff15;padding:10px;margin:10px 0;border-radius:10px}
</style>

<script src="https://js.paystack.co/v1/inline.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

</head>

<body>

<div class="app">

<!-- ADMIN -->
<div class="admin">
<h3>Orders Dashboard</h3>
<div id="orders">Loading...</div>
<h4>Total Sales: GHS <span id="total">0</span></h4>
</div>

<!-- SHOP -->
<h2>Prettysafedata Hub</h2>

<h4>Network</h4>
<div class="box net">MTN</div>
<div class="box net">TELECEL</div>
<div class="box net">AT</div>

<h4>Plan</h4>
<div class="box plan">1GB - 5</div>
<div class="box plan">2GB - 10</div>
<div class="box plan">5GB - 20</div>

<input id="phone" placeholder="Phone number">
<button id="buy">Buy Data</button>

</div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAOtIxgs88Nfny4c_WnIF95GpmqHGtaYio",
  authDomain: "prettysafedata-hub.firebaseapp.com",
  projectId: "prettysafedata-hub"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* STATE */
let network = "";
let plan = 0;

/* SELECT NETWORK */
document.querySelectorAll(".net").forEach(n=>{
 n.onclick=()=>{
  document.querySelectorAll(".net").forEach(x=>x.classList.remove("active"));
  n.classList.add("active");
  network=n.innerText;
 };
});

/* SELECT PLAN */
document.querySelectorAll(".plan").forEach(p=>{
 p.onclick=()=>{
  document.querySelectorAll(".plan").forEach(x=>x.classList.remove("active"));
  p.classList.add("active");
  plan=parseInt(p.innerText);
 };
});

/* LOAD ORDERS */
async function loadOrders(){
 try{
  let snap = await db.collection("orders").get();

  let html = "";
  let total = 0;

  snap.forEach(doc=>{
    let o = doc.data();
    total += Number(o.plan);

    html += `
    <div class="card">
    <b>Network:</b> ${o.network}<br>
    <b>Plan:</b> ${o.plan}<br>
    <b>Phone:</b> ${o.phone}<br>
    <b>Status:</b> ${o.status}<br>
    </div>`;
  });

  document.getElementById("orders").innerHTML = html || "No orders yet";
  document.getElementById("total").innerText = total;

 }catch(e){
  document.getElementById("orders").innerHTML = "DB not loaded";
 }
}

/* BUY BUTTON */
document.getElementById("buy").onclick = function () {

alert("CLICK DETECTED ✔");

let phone = document.getElementById("phone").value;

if(!network || !plan || !phone){
 alert("Fill all fields");
 return;
}

/* FINAL SAFE CHECK */
if(!window.PaystackPop){
 alert("Payment system not loaded. Open in Chrome and refresh.");
 return;
}

let handler = PaystackPop.setup({
  key: "pk_test_a264d8673ba4f2a6a3fdf36ae95f29a120493176",
  email: "customer@test.com",
  amount: plan * 100,
  currency: "GHS",
  ref: "TX" + Date.now(),

  callback: async function(res){

    try{
      await db.collection("orders").add({
        network,
        plan,
        phone,
        status:"Paid",
        ref:res.reference,
        time:new Date().toISOString()
      });

      alert("Payment successful ✔");
      loadOrders();

    }catch(e){
      alert("Paid but database error");
    }

  }
});

handler.openIframe();

};

loadOrders();

</script>

</body>
</html>
