<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prettysafedata Hub</title>

<style>
body{margin:0;font-family:system-ui;background:#0b0f2f;color:white}
.app{max-width:420px;margin:auto;padding:20px}
.box{background:#ffffff22;padding:15px;margin:10px 0;border-radius:10px;cursor:pointer}
.active{border:2px solid #2563eb}
input,button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:8px}
button{background:#2563eb;color:white;font-weight:bold}
#admin{display:none;background:#111827;padding:20px}
.card{background:#ffffff15;padding:10px;margin:10px 0;border-radius:10px}
</style>

<script src="https://js.paystack.co/v1/inline.js"></script>

</head>

<body>

<!-- SHOP -->
<div class="app" id="shop">

<h2>Prettysafedata Hub</h2>

<button onclick="openAdmin()">Admin</button>

<h4>Network</h4>
<div class="box net">MTN</div>
<div class="box net">TELECEL</div>
<div class="box net">AT</div>

<h4>Plan</h4>
<div class="box plan">1GB - 5</div>
<div class="box plan">2GB - 10</div>
<div class="box plan">5GB - 20</div>

<input id="phone" placeholder="Phone number">
<button id="buy">Buy Data</button>

</div>

<!-- ADMIN -->
<div id="admin">
<h2>Orders</h2>
<button onclick="closeAdmin()">Back</button>
<div id="orders">No data yet</div>
</div>

<script>
/* SIMPLE STORAGE (temporary until Firebase fully stable) */
let orders = [];

/* SELECT */
let network="", plan=0;

document.querySelectorAll(".net").forEach(n=>{
 n.onclick=()=>{
  document.querySelectorAll(".net").forEach(x=>x.classList.remove("active"));
  n.classList.add("active");
  network=n.innerText;
 };
});

document.querySelectorAll(".plan").forEach(p=>{
 p.onclick=()=>{
  document.querySelectorAll(".plan").forEach(x=>x.classList.remove("active"));
  p.classList.add("active");
  plan=parseInt(p.innerText);
 };
});

/* BUY */
document.getElementById("buy").onclick=function(){

let phone=document.getElementById("phone").value;

if(!network || !plan || !phone){
 alert("Fill all fields");
 return;
}

if(typeof PaystackPop === "undefined"){
 alert("Payment system not loaded. Refresh page.");
 return;
}

let handler = PaystackPop.setup({
  key: "pk_test_a264d8673ba4f2a6a3fdf36ae95f29a120493176",
  email: "customer@test.com",
  amount: plan * 100,
  currency: "GHS",
  ref: "TX" + Date.now(),

  callback: function(res){

    orders.push({
      network,
      plan,
      phone,
      status:"Paid",
      ref:res.reference,
      time:new Date().toISOString()
    });

    alert("Payment successful!");
  }
});

handler.openIframe();

};

/* ADMIN */
function openAdmin(){
 document.getElementById("shop").style.display="none";
 document.getElementById("admin").style.display="block";

 let html="";
 orders.forEach(o=>{
  html+=`
  <div class="card">
  <b>Network:</b> ${o.network}<br>
  <b>Plan:</b> ${o.plan}<br>
  <b>Phone:</b> ${o.phone}<br>
  <b>Status:</b> ${o.status}<br>
  <b>Time:</b> ${o.time}
  </div>`;
 });

 document.getElementById("orders").innerHTML = html || "No orders yet";
}

function closeAdmin(){
 document.getElementById("admin").style.display="none";
 document.getElementById("shop").style.display="block";
}

</script>

</body>
</html>
