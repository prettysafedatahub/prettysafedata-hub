<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prettysafedata Hub</title>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, Arial;
      background: radial-gradient(circle at top, #1f2a5a, #0b0f2f);
      color: white;
    }

    .app {
      max-width: 420px;
      margin: auto;
      padding: 20px;
    }

    .top h1 {
      font-size: 26px;
    }

    .networks {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .net {
      flex: 1;
      padding: 16px;
      border-radius: 14px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
      background: rgba(255,255,255,0.12);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      padding: 18px;
      border-radius: 16px;
      text-align: center;
      cursor: pointer;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      margin-top: 20px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(90deg,#2563eb,#4f46e5);
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="top">
    <h1>Prettysafedata Hub</h1>
    <p>Instant Mobile Data • MTN • Telecel • AT</p>
  </div>

  <div class="networks">
    <div class="net">MTN</div>
    <div class="net">Telecel</div>
    <div class="net">AT</div>
  </div>

  <div class="grid">
    <div class="card">1GB - GHS 5</div>
    <div class="card">2GB - GHS 10</div>
    <div class="card">5GB - GHS 20</div>
    <div class="card">10GB - GHS 35</div>
  </div>

  <input placeholder="Enter phone number" />
  <button>Buy Data</button>

</div>

<script>
/* 🔥 STEP 1: PASTE YOUR FIREBASE CONFIG HERE */
const firebaseConfig = {
  apiKey: "PASTE_HERE",
  authDomain: "PASTE_HERE",
  projectId: "PASTE_HERE",
  storageBucket: "PASTE_HERE",
  messagingSenderId: "PASTE_HERE",
  appId: "PASTE_HERE"
};

/* 🔥 STEP 2: INIT FIREBASE */
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* STATE */
let selectedNetwork = "";
let selectedPlan = "";

/* NETWORK SELECT */
document.querySelectorAll(".net").forEach(el => {
  el.addEventListener("click", () => {
    selectedNetwork = el.innerText;
  });
});

/* PLAN SELECT */
document.querySelectorAll(".card").forEach(el => {
  el.addEventListener("click", () => {
    selectedPlan = el.innerText;
  });
});

/* BUY + SAVE TO FIREBASE */
document.querySelector("button").addEventListener("click", () => {
  const phone = document.querySelector("input").value;

  if (!selectedNetwork || !selectedPlan || !phone) {
    alert("Please fill all fields");
    return;
  }

  const order = {
    network: selectedNetwork,
    plan: selectedPlan,
    phone: phone,
    status: "Pending",
    time: new Date()
  };

  db.collection("orders").add(order)
    .then(() => alert("Order saved successfully!"))
    .catch(err => alert(err.message));
});
</script>

</body>
</html>
