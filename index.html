<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prettysafedata Hub</title>

<script src="https://js.paystack.co/v1/inline.js"></script>

<style>
body{margin:0;font-family:system-ui;background:#0b0f2f;color:white}
.app{max-width:420px;margin:auto;padding:20px}
.box{background:#ffffff22;padding:15px;margin:10px 0;border-radius:10px;cursor:pointer}
.active{border:2px solid #2563eb}
input,button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:8px}
button{background:#2563eb;color:white;font-weight:bold}
#admin{display:none;background:#111827;padding:20px}
.card{background:#ffffff15;padding:10px;margin:10px 0;border-radius:10px}
</style>
</head>

<body>

<!-- SHOP -->
<div class="app" id="shop">

<h2>Prettysafedata Hub</h2>

<button onclick="showAdmin()">Admin</button>

<h4>Network</h4>
<div class="box net">MTN</div>
<div class="box net">TELECEL</div>
<div class="box net">AT</div>

<h4>Plan</h4>
<div class="box plan">1GB - 5</div>
<div class="box plan">2GB - 10</div>
<div class="box plan">5GB - 20</div>

<input id="phone" placeholder="Phone number">
<button id="buy">Buy Data</button>

</div>

<!-- ADMIN -->
<div id="admin">
<h2>Orders Dashboard</h2>
<button onclick="showShop()">Back</button>
<div id="orders">Loading...</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAOtIxgs88Nfny4c_WnIF95GpmqHGtaYio",
  authDomain: "prettysafedata-hub.firebaseapp.com",
  projectId: "prettysafedata-hub",
  storageBucket: "prettysafedata-hub.firebasestorage.app",
  messagingSenderId: "291519826599",
  appId: "1:291519826599:web:0546c070a173b7fbdde982"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let network="", plan=0;

document.querySelectorAll(".net").forEach(n=>{
 n.onclick=()=>{
  document.querySelectorAll(".net").forEach(x=>x.classList.remove("active"));
  n.classList.add("active");
  network=n.innerText;
 };
});

document.querySelectorAll(".plan").forEach(p=>{
 p.onclick=()=>{
  document.querySelectorAll(".plan").forEach(x=>x.classList.remove("active"));
  p.classList.add("active");
  plan=parseInt(p.innerText.match(/\d+/)[0]);
 };
});

document.getElementById("buy").onclick=function(){

let phone=document.getElementById("phone").value;

if(!network||!plan||!phone){
 alert("Fill all fields");
 return;
}

let handler=PaystackPop.setup({
 key:"pk_test_a264d8673ba4f2a6a3fdf36ae95f29a120493176",
 email:"customer@test.com",
 amount:plan*100,
 currency:"GHS",
 ref:"TX"+Date.now(),

 callback:async function(res){

 await addDoc(collection(db,"orders"),{
  network,
  plan,
  phone,
  status:"Paid",
  ref:res.reference,
  time:new Date().toISOString()
 });

 alert("Payment successful!");
 loadOrders();
 }
});

handler.openIframe();

};

/* ADMIN */
window.showAdmin=()=>{
 document.getElementById("shop").style.display="none";
 document.getElementById("admin").style.display="block";
 loadOrders();
};

window.showShop=()=>{
 document.getElementById("admin").style.display="none";
 document.getElementById("shop").style.display="block";
};

async function loadOrders(){
 const snap=await getDocs(collection(db,"orders"));
 let html="";
 snap.forEach(doc=>{
  let d=doc.data();
  html+=`
  <div class="card">
  <b>Network:</b> ${d.network}<br>
  <b>Plan:</b> ${d.plan}<br>
  <b>Phone:</b> ${d.phone}<br>
  <b>Status:</b> ${d.status}<br>
  <b>Time:</b> ${d.time}
  </div>`;
 });
 document.getElementById("orders").innerHTML=html;
}

window.loadOrders=loadOrders;

</script>

</body>
</html>
