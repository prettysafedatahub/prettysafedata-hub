<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prettysafedata Hub</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui;
      background: radial-gradient(circle at top, #1f2a5a, #0b0f2f);
      color: white;
    }

    .app {
      max-width: 420px;
      margin: auto;
      padding: 20px;
    }

    h1 { font-size: 26px; }

    .networks {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .net {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.12);
      text-align: center;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      padding: 16px;
      border-radius: 14px;
      text-align: center;
      cursor: pointer;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border-radius: 12px;
      border: none;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border-radius: 12px;
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Prettysafedata Hub</h1>
  <p>Instant Mobile Data • MTN • Telecel • AT</p>

  <div class="networks">
    <div class="net">MTN</div>
    <div class="net">Telecel</div>
    <div class="net">AT</div>
  </div>

  <div class="grid">
    <div class="card">1GB - GHS 5</div>
    <div class="card">2GB - GHS 10</div>
    <div class="card">5GB - GHS 20</div>
    <div class="card">10GB - GHS 35</div>
  </div>

  <input id="phone" placeholder="Enter phone number" />
  <button id="buyBtn">Buy Data</button>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAOtIxgs88Nfny4c_WnIF95GpmqHGtaYio",
    authDomain: "prettysafedata-hub.firebaseapp.com",
    projectId: "prettysafedata-hub",
    storageBucket: "prettysafedata-hub.firebasestorage.app",
    messagingSenderId: "291519826599",
    appId: "1:291519826599:web:0546c070a173b7fbdde982"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let selectedNetwork = "";
  let selectedPlan = "";

  document.querySelectorAll(".net").forEach(el => {
    el.addEventListener("click", () => {
      selectedNetwork = el.innerText;
    });
  });

  document.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => {
      selectedPlan = el.innerText;
    });
  });

  document.getElementById("buyBtn").addEventListener("click", async () => {
    const phone = document.getElementById("phone").value;

    if (!selectedNetwork || !selectedPlan || !phone) {
      alert("Fill all fields");
      return;
    }

    const order = {
      network: selectedNetwork,
      plan: selectedPlan,
      phone: phone,
      status: "Pending",
      time: new Date()
    };

    try {
      await addDoc(collection(db, "orders"), order);
      alert("Order saved successfully!");
    } catch (e) {
      alert("Error: " + e.message);
    }
  });
</script>

</body>
</html>
