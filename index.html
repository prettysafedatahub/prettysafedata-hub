<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prettysafedata Hub</title>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

  <style>
    body { font-family: system-ui; background:#0b0f2f; color:white; margin:0; }
    .app { max-width:420px; margin:auto; padding:20px; }
    .net, .card { padding:15px; margin:5px; background:rgba(255,255,255,0.1); border-radius:10px; cursor:pointer; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    input, button { width:100%; padding:12px; margin-top:10px; border:none; border-radius:10px; }
    button { background:#2563eb; color:white; font-weight:bold; }
  </style>
</head>

<body>

<div class="app">
  <h2>Prettysafedata Hub</h2>

  <div class="net">MTN</div>
  <div class="net">Telecel</div>
  <div class="net">AT</div>

  <div class="grid">
    <div class="card">1GB - GHS 5</div>
    <div class="card">2GB - GHS 10</div>
    <div class="card">5GB - GHS 20</div>
    <div class="card">10GB - GHS 35</div>
  </div>

  <input id="phone" placeholder="Enter phone number">
  <button id="buy">Buy Data</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAOtIxgs88Nfny4c_WnIF95GpmqHGtaYio",
  authDomain: "prettysafedata-hub.firebaseapp.com",
  projectId: "prettysafedata-hub",
  storageBucket: "prettysafedata-hub.firebasestorage.app",
  messagingSenderId: "291519826599",
  appId: "1:291519826599:web:0546c070a173b7fbdde982"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let network = "";
let plan = "";

document.querySelectorAll(".net").forEach(el=>{
  el.onclick=()=> network = el.innerText;
});

document.querySelectorAll(".card").forEach(el=>{
  el.onclick=()=> plan = el.innerText;
});

document.getElementById("buy").onclick = async ()=>{
  const phone = document.getElementById("phone").value;

  if(!network || !plan || !phone){
    alert("Fill all fields");
    return;
  }

  await db.collection("orders").add({
    network,
    plan,
    phone,
    status:"Pending",
    time:new Date()
  });

  alert("Order saved!");
};
</script>

</body>
</html>
