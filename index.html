<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prettysafedata Hub</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:linear-gradient(135deg,#0b0f2f,#1f2a5a);
  color:white;
}

.app{
  max-width:420px;
  margin:auto;
  padding:20px;
}

h1{margin:0;}

.networks{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.net{
  flex:1;
  padding:15px;
  border-radius:12px;
  background:#ffffff20;
  text-align:center;
  cursor:pointer;
}

.active{
  background:#2563eb !important;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px;
}

.card{
  padding:15px;
  background:#ffffff15;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
}

.selected{
  border:2px solid #4f46e5;
}

input{
  width:100%;
  padding:12px;
  margin-top:20px;
  border-radius:10px;
  border:none;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="app">

<h1>Prettysafedata Hub</h1>
<p>Instant Mobile Data</p>

<div class="networks">
  <div class="net">MTN</div>
  <div class="net">Telecel</div>
  <div class="net">AT</div>
</div>

<div class="grid">
  <div class="card">1GB - GHS 5</div>
  <div class="card">2GB - GHS 10</div>
  <div class="card">5GB - GHS 20</div>
  <div class="card">10GB - GHS 35</div>
</div>

<input id="phone" placeholder="Enter phone number">
<button id="buy">Buy Data</button>

</div>

<script>
let network="";
let plan="";

/* NETWORK CLICK */
document.querySelectorAll(".net").forEach(n=>{
  n.onclick=()=>{
    document.querySelectorAll(".net").forEach(x=>x.classList.remove("active"));
    n.classList.add("active");
    network=n.innerText;
  };
});

/* PLAN CLICK */
document.querySelectorAll(".card").forEach(c=>{
  c.onclick=()=>{
    document.querySelectorAll(".card").forEach(x=>x.classList.remove("selected"));
    c.classList.add("selected");
    plan=c.innerText;
  };
});

/* BUTTON ACTION */
document.getElementById("buy").onclick=()=>{
  const phone=document.getElementById("phone").value;

  if(!network||!plan||!phone){
    alert("Please fill all fields");
    return;
  }

  alert("Order ready (Firebase will be added next step)");
};
</script>

</body>
</html>
