<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prettysafedata Hub</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:linear-gradient(135deg,#0b0f2f,#1f2a5a);
  color:white;
}

.app{
  max-width:420px;
  margin:auto;
  padding:20px;
}

h1{margin:0;}

.networks{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.net{
  flex:1;
  padding:18px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

.net:hover{
  transform:scale(1.05);
}

/* NETWORK COLORS */
.mtn{ background:#ffcc00; color:black; }
.telecel{ background:#e60000; }
.at{ background:#007bff; }

.active{
  outline:3px solid white;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px;
}

.card{
  padding:15px;
  background:rgba(255,255,255,0.1);
  border-radius:12px;
  text-align:center;
  cursor:pointer;
}

.selected{
  border:2px solid #4f46e5;
}

input{
  width:100%;
  padding:12px;
  margin-top:20px;
  border-radius:10px;
  border:none;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="app">

<h1>Prettysafedata Hub</h1>
<p>Instant Mobile Data • MTN • Telecel • AT</p>

<!-- NETWORKS -->
<div class="networks">
  <div class="net mtn">MTN</div>
  <div class="net telecel">TELECEL</div>
  <div class="net at">AT</div>
</div>

<!-- PLANS -->
<div class="grid">
  <div class="card">1GB - GHS 5</div>
  <div class="card">2GB - GHS 10</div>
  <div class="card">5GB - GHS 20</div>
  <div class="card">10GB - GHS 35</div>
</div>

<input id="phone" placeholder="Enter phone number">
<button id="buy">Buy Data</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAOtIxgs88Nfny4c_WnIF95GpmqHGtaYio",
  authDomain: "prettysafedata-hub.firebaseapp.com",
  projectId: "prettysafedata-hub",
  storageBucket: "prettysafedata-hub.firebasestorage.app",
  messagingSenderId: "291519826599",
  appId: "1:291519826599:web:0546c070a173b7fbdde982"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let network="";
let plan="";

/* NETWORK CLICK */
document.querySelectorAll(".net").forEach(n=>{
  n.onclick=()=>{
    document.querySelectorAll(".net").forEach(x=>x.classList.remove("active"));
    n.classList.add("active");
    network=n.innerText;
  };
});

/* PLAN CLICK */
document.querySelectorAll(".card").forEach(c=>{
  c.onclick=()=>{
    document.querySelectorAll(".card").forEach(x=>x.classList.remove("selected"));
    c.classList.add("selected");
    plan=c.innerText;
  };
});

/* BUY ORDER */
document.getElementById("buy").onclick=async()=>{
  const phone=document.getElementById("phone").value;

  if(!network||!plan||!phone){
    alert("Fill all fields");
    return;
  }

  await addDoc(collection(db,"orders"),{
    network,
    plan,
    phone,
    status:"Pending",
    time:new Date()
  });

  alert("Order saved successfully!");
};
</script>

</body>
</html>
