<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prettysafedata Hub</title>

<script src="https://js.paystack.co/v1/inline.js"></script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:linear-gradient(135deg,#0b0f2f,#1f2a5a);
  color:white;
}

.app{
  max-width:420px;
  margin:auto;
  padding:20px;
}

h1{margin:0;}

.net, .card, button{
  cursor:pointer;
  user-select:none;
}

.net{
  padding:15px;
  margin:6px 0;
  background:#ffffff22;
  border-radius:10px;
}

.card{
  padding:15px;
  margin:6px 0;
  background:#ffffff22;
  border-radius:10px;
}

.active{
  border:2px solid #2563eb;
}

.selected{
  border:2px solid #4f46e5;
}

input{
  width:100%;
  padding:12px;
  margin-top:15px;
  border-radius:10px;
  border:none;
}

button{
  width:100%;
  padding:14px;
  margin-top:15px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="app">

<h1>Prettysafedata Hub</h1>
<p>Buy MTN • Telecel • AT Data</p>

<h3>Select Network</h3>
<div class="net">MTN</div>
<div class="net">TELECEL</div>
<div class="net">AT</div>

<h3>Select Plan</h3>
<div class="card">1GB - GHS 5</div>
<div class="card">2GB - GHS 10</div>
<div class="card">5GB - GHS 20</div>
<div class="card">10GB - GHS 35</div>

<input id="phone" placeholder="Enter phone number">
<button id="buy">Buy Data</button>

</div>

<script>
window.onload = function(){

let network = "";
let plan = 0;

/* NETWORK CLICK */
document.querySelectorAll(".net").forEach(n=>{
  n.addEventListener("click",()=>{
    document.querySelectorAll(".net").forEach(x=>x.classList.remove("active"));
    n.classList.add("active");
    network = n.innerText;
  });
});

/* PLAN CLICK */
document.querySelectorAll(".card").forEach(c=>{
  c.addEventListener("click",()=>{
    document.querySelectorAll(".card").forEach(x=>x.classList.remove("selected"));
    c.classList.add("selected");
    plan = parseInt(c.innerText.match(/\d+/)[0]);
  });
});

/* BUY BUTTON */
document.getElementById("buy").addEventListener("click",function(){

  const phone = document.getElementById("phone").value;

  if(!network || !plan || !phone){
    alert("Select network, plan and enter phone");
    return;
  }

  let handler = PaystackPop.setup({
    key: "pk_test_a264d8673ba4f2a6a3fdf36ae95f29a120493176",
    email: "customer@example.com",
    amount: plan * 100,
    currency: "GHS",
    ref: "TX"+Date.now(),

    callback: function(response){
      alert("Payment successful! Reference: " + response.reference);
    },

    onClose: function(){
      alert("Payment cancelled");
    }
  });

  handler.openIframe();
});

};
</script>

</body>
</html>
