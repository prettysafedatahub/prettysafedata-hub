<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prettysafedata Hub</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, Arial;
      background: radial-gradient(circle at top, #1f2a5a, #0b0f2f);
      color: white;
    }

    .app {
      max-width: 420px;
      margin: auto;
      padding: 20px;
    }

    .top h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .top p {
      opacity: 0.7;
      font-size: 13px;
    }

    /* NETWORKS */
    .networks {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .net {
      flex: 1;
      padding: 16px;
      border-radius: 14px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      color: white;
      border: 1px solid transparent;
    }

    .mtn { background: #ffcc00; color: black; }
    .telecel { background: #e53935; }
    .at { background: #1e88e5; }

    .net:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    /* PLANS */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      padding: 18px;
      border-radius: 16px;
      text-align: center;
      backdrop-filter: blur(10px);
      transition: 0.2s;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .card:hover {
      transform: scale(1.05);
      border: 1px solid #2563eb;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      margin-top: 20px;
    }

    button {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: none;
      margin-top: 12px;
      background: linear-gradient(90deg, #2563eb, #4f46e5);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.02);
    }

    /* CHECKOUT */
    .checkout {
      width: 320px;
      background: rgba(255,255,255,0.08);
      padding: 20px;
      border-radius: 16px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="top">
    <h1>Prettysafedata Hub</h1>
    <p>Instant Mobile Data • MTN • Telecel • AT</p>
  </div>

  <!-- NETWORKS -->
  <div class="networks">
    <div class="net mtn">MTN</div>
    <div class="net telecel">Telecel</div>
    <div class="net at">AT</div>
  </div>

  <!-- PLANS -->
  <div class="grid">
    <div class="card">1GB - GHS 5</div>
    <div class="card">2GB - GHS 10</div>
    <div class="card">5GB - GHS 20</div>
    <div class="card">10GB - GHS 35</div>
  </div>

  <input placeholder="Enter phone number" />
  <button>Buy Data</button>

</div>

<script>
let selectedNetwork = "";
let selectedPlan = "";
let phone = "";

// network select
document.querySelectorAll(".net").forEach(el => {
  el.addEventListener("click", () => {
    document.querySelectorAll(".net").forEach(n => {
      n.style.transform = "none";
      n.style.opacity = "1";
    });

    el.style.transform = "translateY(-2px)";
    el.style.opacity = "0.8";
    selectedNetwork = el.innerText;
  });
});

// plan select
document.querySelectorAll(".card").forEach(el => {
  el.addEventListener("click", () => {
    document.querySelectorAll(".card").forEach(c => c.style.border = "1px solid transparent");
    el.style.border = "1px solid #2563eb";
    selectedPlan = el.innerText;
  });
});

// checkout flow
document.querySelector("button").addEventListener("click", () => {
  phone = document.querySelector("input").value;

  if (!selectedNetwork || !selectedPlan || !phone) {
    alert("Please select network, plan and enter phone number");
    return;
  }

  document.body.innerHTML = `
    <div style="
      font-family: system-ui;
      background: #0b0f2f;
      color: white;
      height: 100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    ">
      <div class="checkout">

        <h2>Confirm Order</h2>

        <p><b>Network:</b> ${selectedNetwork}</p>
        <p><b>Plan:</b> ${selectedPlan}</p>
        <p><b>Phone:</b> ${phone}</p>

        <button onclick="alert('Order submitted successfully!')">
          Confirm Purchase
        </button>

        <button onclick="location.reload()" style="background:#333;">
          Back
        </button>

      </div>
    </div>
  `;
});
</script>

</body>
</html>
