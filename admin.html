<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>
body{font-family:system-ui;background:#111827;color:white;margin:0;padding:20px}
.card{background:#ffffff15;padding:12px;margin:10px 0;border-radius:10px}
</style>
</head>

<body>

<h2>Orders Dashboard</h2>
<div id="orders">Loading...</div>

<script>
async function load(){

let res = await fetch("https://YOUR_FIREBASE_URL/orders.json");
let data = await res.json();

let html="";

for(let id in data){
 let d=data[id];
 html+=`
 <div class="card">
  <b>Network:</b> ${d.network}<br>
  <b>Plan:</b> ${d.plan}<br>
  <b>Phone:</b> ${d.phone}<br>
  <b>Status:</b> ${d.status}<br>
  <b>Time:</b> ${d.time}
 </div>
 `;
}

document.getElementById("orders").innerHTML=html;

}

load();
</script>

</body>
</html>
